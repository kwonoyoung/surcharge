<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>부의금 내역 조회</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#16231d;--muted:#6c7b73;--line:#dfe8e3;--accent:#176b45;--accent2:#0f5134;--soft:#eaf5ef;--danger:#b42318;--shadow:0 18px 50px rgba(18,50,34,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
body{padding:clamp(18px,4vw,48px)}
.wrap{width:min(760px,100%);margin:0 auto}.hero{padding:10px 4px 18px}.eyebrow{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.08em}.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.12;margin:10px 0 10px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.75}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.search{padding:clamp(20px,5vw,34px)}
label{display:block;font-weight:800;margin-bottom:10px}.row{display:grid;grid-template-columns:1fr auto;gap:10px}input{min-width:0;width:100%;height:56px;border:1.5px solid #cbd9d1;border-radius:14px;padding:0 16px;font:inherit;font-size:18px;outline:none;background:#fff}input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(23,107,69,.11)}button{height:56px;border:0;border-radius:14px;padding:0 22px;font:inherit;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}button:hover{background:var(--accent2)}button:disabled{opacity:.55;cursor:default}.hint{font-size:13px;color:var(--muted);margin-top:10px}
#status{display:none;margin-top:16px;padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.55}#status.show{display:block}#status.info{background:var(--soft);color:var(--accent2)}#status.error{background:#fff1f0;color:var(--danger)}
.results{display:none;border-top:1px solid var(--line);padding:clamp(20px,5vw,34px);background:#fbfdfc}.results.show{display:block}.resultHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.resultHead h2{font-size:22px;margin:0}.badge{white-space:nowrap;background:var(--soft);color:var(--accent);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}
.summary{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 18px}.summary.show{display:grid}.sumBox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.sumBox span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.sumBox strong{font-size:21px;letter-spacing:-.03em}
.record{background:#fff;border:1px solid var(--line);border-radius:18px;padding:4px 18px;margin-top:12px}.field{display:grid;grid-template-columns:minmax(88px,34%) 1fr;gap:14px;padding:13px 0;border-bottom:1px dashed #e4ebe7;align-items:start}.field:last-child{border-bottom:0}.k{color:var(--muted);font-size:14px}.v{text-align:right;font-weight:750;overflow-wrap:anywhere}.amount{color:var(--accent2);font-size:18px;font-weight:900}.empty{color:var(--muted)}
.privacy{margin-top:14px;font-size:12px;color:#829087;line-height:1.65}.footer{text-align:center;color:#91a096;font-size:12px;padding:22px 0 4px}
@media(max-width:540px){body{padding:16px}.row{grid-template-columns:1fr}.row button{width:100%}.field{grid-template-columns:1fr;gap:5px}.v{text-align:left}.summary{grid-template-columns:1fr}.resultHead{align-items:center}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="eyebrow">CONDOLENCE RECORD</div>
    <h1>부의금 내역 조회</h1>
    <p>성명을 정확히 입력하면 등록된 부의금 내역을 확인할 수 있습니다.</p>
  </header>
  <section class="card" aria-label="부의금 조회">
    <div class="search">
      <label for="nameInput">이름</label>
      <div class="row">
        <input id="nameInput" type="text" autocomplete="off" inputmode="text" placeholder="예: 홍길동" maxlength="30" aria-describedby="hint" />
        <button id="searchBtn" type="button">조회하기</button>
      </div>
      <div id="hint" class="hint">띄어쓰기는 무시하며, 정확한 이름으로 조회합니다.</div>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <div id="results" class="results" aria-live="polite">
      <div class="resultHead"><h2 id="resultTitle">조회 결과</h2><div id="resultBadge" class="badge"></div></div>
      <div id="summary" class="summary"></div>
      <div id="records"></div>
    </div>
  </section>
  <p class="privacy">※ 이 페이지는 입력한 이름과 일치하는 내역만 화면에 표시합니다. GitHub Pages는 공개 정적 호스팅이므로 민감한 개인정보를 완전히 보호하는 용도로는 적합하지 않습니다.</p>
  <footer class="footer">Program by Kwon O Young. 오춘기 권오영</footer>
</main>

<script>
const AMOUNT_HEADERS=["금액"];
const LOOKUP_CTX='surcharge-lookup-v1|';
const KEY_CTX='surcharge-data-v1|';
const te=new TextEncoder(), td=new TextDecoder();
const $=s=>document.querySelector(s);
const input=$('#nameInput'), btn=$('#searchBtn'), status=$('#status'), results=$('#results'), recordsEl=$('#records'), summaryEl=$('#summary');
function normName(s){return (s||'').replace(/\s+/g,'').trim()}
function bufToHex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function b64ToBuf(s){const bin=atob(s), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a.buffer}
async function sha256(s){return crypto.subtle.digest('SHA-256',te.encode(s))}
async function decryptForName(name, pack){
  const rawKey=await sha256(KEY_CTX+name);
  const key=await crypto.subtle.importKey('raw',rawKey,{name:'AES-GCM'},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b64ToBuf(pack.iv))},key,b64ToBuf(pack.ct));
  return JSON.parse(td.decode(plain));
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function isAmountHeader(h){return AMOUNT_HEADERS.includes(h)}
function num(v){if(typeof v==='number')return v; const x=Number(String(v??'').replace(/[^0-9.-]/g,'')); return Number.isFinite(x)?x:null}
function formatValue(h,v){const n=num(v); if(isAmountHeader(h)&&n!==null) return n.toLocaleString('ko-KR')+'원'; return esc(v)}
function showStatus(msg,type='info'){status.className='show '+type;status.textContent=msg}
function clearStatus(){status.className='';status.textContent=''}
function render(name,recs){
  $('#resultTitle').textContent=`${name} 님 조회 결과`;
  $('#resultBadge').textContent=`${recs.length}건`;
  let total=0, amountCount=0;
  recs.forEach(r=>Object.entries(r).forEach(([h,v])=>{if(isAmountHeader(h)){const n=num(v);if(n!==null){total+=n;amountCount++}}}));
  if(amountCount){summaryEl.className='summary show';summaryEl.innerHTML=`<div class="sumBox"><span>조회 건수</span><strong>${recs.length.toLocaleString('ko-KR')}건</strong></div><div class="sumBox"><span>금액 합계</span><strong>${total.toLocaleString('ko-KR')}원</strong></div>`}
  else{summaryEl.className='summary';summaryEl.innerHTML=''}
  recordsEl.innerHTML=recs.map((r,idx)=>{
    const nameHeader=r._name_header;
    const entries=Object.entries(r).filter(([h,v])=>!h.startsWith('_') && h!==nameHeader && v!==null && v!=='');
    return `<article class="record">${recs.length>1?`<div class="field"><div class="k">내역</div><div class="v">${idx+1}번째 기록</div></div>`:''}${entries.map(([h,v])=>`<div class="field"><div class="k">${esc(h)}</div><div class="v ${isAmountHeader(h)?'amount':''}">${formatValue(h,v)}</div></div>`).join('')||'<div class="field"><div class="empty">표시할 추가 항목이 없습니다.</div></div>'}</article>`
  }).join('');
  results.className='results show';
  results.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function search(){
  clearStatus(); results.className='results'; recordsEl.innerHTML=''; summaryEl.innerHTML='';
  const name=normName(input.value);
  if(!name){showStatus('조회할 이름을 입력해 주세요.','error');input.focus();return}
  if(!window.crypto?.subtle){showStatus('이 브라우저에서는 보안 조회 기능을 사용할 수 없습니다. 최신 브라우저에서 접속해 주세요.','error');return}
  btn.disabled=true;btn.textContent='조회 중…';
  try{
    const lookup=bufToHex(await sha256(LOOKUP_CTX+name));
    const pack=ENC_INDEX[lookup];
    if(!pack){showStatus('일치하는 이름의 내역이 없습니다. 이름을 다시 확인해 주세요.','error');return}
    const recs=await decryptForName(name,pack);
    render(name,recs);
  }catch(e){console.error(e);showStatus('조회 중 오류가 발생했습니다. 이름을 다시 확인해 주세요.','error')}
  finally{btn.disabled=false;btn.textContent='조회하기'}
}
btn.addEventListener('click',search);input.addEventListener('keydown',e=>{if(e.key==='Enter')search()});input.focus();
</script>
<!-- build meta: 총괄: header row 1, records 166, name col 성명 -->
</body></html>
